[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guixcoder"
version = "0.2.0"
description = "LLM-based web generation agent with DOM-to-code structured feedback"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "GUIxcoder Contributors" }]
keywords = [
    "llm-agent", "code-generation", "web-generation",
    "ui-to-code", "dom-alignment", "structured-feedback",
    "tree-sitter", "webgen",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # guixcoder package (structured-feedback module)
    "tree-sitter>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.25.0",
    # agent loop
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "selenium>=4.15.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
demo = ["flask>=3.0.0"]

[project.urls]
Homepage = "https://github.com/omgwwcd/GUIxcoder"
Repository = "https://github.com/omgwwcd/GUIxcoder"

[project.scripts]
guixcoder = "infer:main"

[tool.setuptools.packages.find]
include = ["guixcoder*", "agent*"]
exclude = ["demo*", "examples*", "benchmarks*", "tests*", "docs*"]
