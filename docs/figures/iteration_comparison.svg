<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38a169"/>
    </marker>
    <style>
      .t { font-size: 16px; font-weight: 700; fill: #1a202c; }
      .sub { font-size: 12px; fill: #4a5568; }
      .lane-b { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; fill: #c53030; }
      .lane-g { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; fill: #276749; }
      .code { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 11.5px; fill: #2d3748; }
      .code-g { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 600; fill: #276749; }
      .code-dim { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 11px; font-style: italic; fill: #a0aec0; }
      .step { font-size: 11.5px; font-weight: 700; fill: #1a202c; }
      .step-sub { font-size: 10.5px; fill: #4a5568; }
      .bad { font-size: 11px; font-weight: 700; fill: #c53030; }
      .ok { font-size: 11px; font-weight: 700; fill: #276749; }
      .sum-b { font-size: 11.5px; font-weight: 700; fill: #c53030; }
      .sum-g { font-size: 11.5px; font-weight: 700; fill: #276749; }
    </style>
  </defs>

  <text x="450" y="22" class="t" text-anchor="middle">How the feedback channel shapes next-turn edits</text>
  <text x="450" y="42" class="sub" text-anchor="middle">Step 1 — both agents build the search page; VLM observes a red "No stock found" error box</text>

  <!-- Lane labels -->
  <text x="225" y="68" class="lane-b" text-anchor="middle">BASELINE feedback → next-turn LLM</text>
  <text x="675" y="68" class="lane-g" text-anchor="middle">GUIxcoder feedback → next-turn LLM</text>

  <!-- Feedback panels -->
  <rect x="20" y="78" width="410" height="120" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.3"/>
  <text x="30" y="100" class="code">VLM: "The search page shows a red error</text>
  <text x="30" y="116" class="code">     box 'No stock found'."</text>
  <text x="30" y="156" class="code-dim">(no code location — LLM has to guess which file)</text>

  <rect x="470" y="78" width="410" height="120" rx="8" fill="#ffffff" stroke="#38a169" stroke-width="1.3"/>
  <text x="480" y="100" class="code">VLM: "The search page shows a red error</text>
  <text x="480" y="116" class="code">     box 'No stock found'."</text>
  <text x="480" y="140" class="code-g">→ Code: src/pages/SearchResultPage.jsx:82-84</text>
  <text x="480" y="160" class="code-g">→ Snippet: {results.length === 0 &amp;&amp;</text>
  <text x="480" y="176" class="code-g">              &lt;p&gt;No stock found&lt;/p&gt;}</text>

  <!-- Down arrows feedback → outcome -->
  <line x1="225" y1="200" x2="225" y2="218" stroke="#c53030" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#a-r)"/>
  <line x1="675" y1="200" x2="675" y2="218" stroke="#38a169" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#a-g)"/>

  <!-- Baseline outcome chain -->
  <g>
    <rect x="20" y="222" width="95" height="56" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
    <text x="67" y="242" class="step" text-anchor="middle">Step 2</text>
    <text x="67" y="258" class="step-sub" text-anchor="middle">edits App.js</text>
    <text x="67" y="272" class="bad" text-anchor="middle">grade 2</text>
  </g>
  <line x1="117" y1="250" x2="123" y2="250" stroke="#c53030" stroke-width="1.2" marker-end="url(#a-r)"/>
  <g>
    <rect x="125" y="222" width="95" height="56" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
    <text x="172" y="242" class="step" text-anchor="middle">Step 3</text>
    <text x="172" y="258" class="step-sub" text-anchor="middle">global banner</text>
    <text x="172" y="272" class="bad" text-anchor="middle">grade 2</text>
  </g>
  <line x1="222" y1="250" x2="228" y2="250" stroke="#c53030" stroke-width="1.2" marker-end="url(#a-r)"/>
  <g>
    <rect x="230" y="222" width="95" height="56" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
    <text x="277" y="242" class="step" text-anchor="middle">Step 4</text>
    <text x="277" y="258" class="step-sub" text-anchor="middle">breaks home</text>
    <text x="277" y="272" class="bad" text-anchor="middle">grade 2</text>
  </g>
  <line x1="327" y1="250" x2="333" y2="250" stroke="#c53030" stroke-width="1.2" marker-end="url(#a-r)"/>
  <g>
    <rect x="335" y="222" width="95" height="56" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="382" y="242" class="step" text-anchor="middle">Step 5+</text>
    <text x="382" y="258" class="step-sub" text-anchor="middle">backtrack</text>
    <text x="382" y="272" class="bad" text-anchor="middle">no finish</text>
  </g>

  <!-- GUIxcoder outcome chain -->
  <g>
    <rect x="470" y="222" width="195" height="56" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.2"/>
    <text x="567" y="242" class="step" text-anchor="middle">Step 2</text>
    <text x="567" y="258" class="step-sub" text-anchor="middle">edits SearchResultPage.jsx:82-84</text>
    <text x="567" y="272" class="ok" text-anchor="middle">grade 4</text>
  </g>
  <line x1="667" y1="250" x2="673" y2="250" stroke="#38a169" stroke-width="1.2" marker-end="url(#a-g)"/>
  <g>
    <rect x="675" y="222" width="205" height="56" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.2"/>
    <text x="777" y="242" class="step" text-anchor="middle">Step 3</text>
    <text x="777" y="258" class="step-sub" text-anchor="middle">screenshot + GUI pass</text>
    <text x="777" y="272" class="ok" text-anchor="middle">grade 5 · finish ✓</text>
  </g>

  <!-- Summary lines -->
  <text x="225" y="310" class="sum-b" text-anchor="middle">≥ 5 turns · error_limit hit · task not finished</text>
  <text x="675" y="310" class="sum-g" text-anchor="middle">3 turns · finished · grade 5</text>
</svg>
