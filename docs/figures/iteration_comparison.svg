<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .t { font-size: 16px; font-weight: 700; fill: #1a202c; }
      .lane-b { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; fill: #c53030; }
      .lane-g { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; fill: #276749; }
      .step { font-size: 13px; font-weight: 700; fill: #1a202c; }
      .grade-bad { font-size: 12px; font-weight: 700; fill: #c53030; }
      .grade-ok { font-size: 12px; font-weight: 700; fill: #276749; }
      .outcome-b { font-size: 12px; font-weight: 600; fill: #c53030; }
      .outcome-g { font-size: 12px; font-weight: 600; fill: #276749; }
    </style>
  </defs>

  <text x="450" y="24" class="t" text-anchor="middle">Baseline vs. GUIxcoder — iteration trace</text>

  <!-- Baseline lane -->
  <text x="30" y="60" class="lane-b">BASELINE  (--baseline)</text>

  <g>
    <rect x="30" y="72" width="110" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3"/>
    <text x="85" y="96" class="step" text-anchor="middle">Step 1</text>
    <text x="85" y="118" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="142" y1="102" x2="168" y2="102" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="170" y="72" width="110" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3"/>
    <text x="225" y="96" class="step" text-anchor="middle">Step 2</text>
    <text x="225" y="118" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="282" y1="102" x2="308" y2="102" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="310" y="72" width="110" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3"/>
    <text x="365" y="96" class="step" text-anchor="middle">Step 3</text>
    <text x="365" y="118" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="422" y1="102" x2="448" y2="102" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="450" y="72" width="110" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3"/>
    <text x="505" y="96" class="step" text-anchor="middle">Step 4</text>
    <text x="505" y="118" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="562" y1="102" x2="588" y2="102" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="590" y="72" width="110" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="645" y="96" class="step" text-anchor="middle">Step 5+</text>
    <text x="645" y="118" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="702" y1="102" x2="728" y2="102" stroke="#c53030" stroke-width="1.3" marker-end="url(#a)"/>

  <text x="735" y="106" class="outcome-b">error_limit · never finishes</text>

  <!-- GUIxcoder lane -->
  <text x="30" y="172" class="lane-g">GUIxcoder  (--structured)</text>

  <g>
    <rect x="30" y="184" width="110" height="60" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.3"/>
    <text x="85" y="208" class="step" text-anchor="middle">Step 1</text>
    <text x="85" y="230" class="grade-bad" text-anchor="middle">✗ grade 2</text>
  </g>
  <line x1="142" y1="214" x2="168" y2="214" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="170" y="184" width="110" height="60" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.3"/>
    <text x="225" y="208" class="step" text-anchor="middle">Step 2</text>
    <text x="225" y="230" class="grade-ok" text-anchor="middle">✓ grade 4</text>
  </g>
  <line x1="282" y1="214" x2="308" y2="214" stroke="#4a5568" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="310" y="184" width="110" height="60" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.3"/>
    <text x="365" y="208" class="step" text-anchor="middle">Step 3</text>
    <text x="365" y="230" class="grade-ok" text-anchor="middle">✓ grade 5</text>
  </g>
  <line x1="422" y1="214" x2="448" y2="214" stroke="#38a169" stroke-width="1.3" marker-end="url(#a)"/>

  <text x="455" y="218" class="outcome-g">finish · 3 iterations</text>
</svg>
