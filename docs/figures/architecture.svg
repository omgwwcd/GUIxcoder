<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1a202c; }
      .box-title { font-size: 13px; font-weight: 600; fill: #1a202c; }
      .pkg-title { font-size: 14px; font-weight: 700; fill: #276749; }
      .sub { font-size: 11px; fill: #4a5568; }
      .g-sub { font-size: 11px; fill: #2f855a; }
    </style>
  </defs>

  <text x="450" y="28" class="title" text-anchor="middle">GUIxcoder — DOM→Code structured feedback for web-generation agents</text>

  <!-- Main loop: 5 boxes -->
  <rect x="30" y="70" width="130" height="60" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.3"/>
  <text x="95" y="96" class="box-title" text-anchor="middle">Instruction</text>
  <text x="95" y="114" class="sub" text-anchor="middle">natural language</text>

  <rect x="190" y="70" width="130" height="60" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.3"/>
  <text x="255" y="96" class="box-title" text-anchor="middle">Code-gen LLM</text>
  <text x="255" y="114" class="sub" text-anchor="middle">writes JSX / CSS</text>

  <rect x="350" y="70" width="130" height="60" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.3"/>
  <text x="415" y="96" class="box-title" text-anchor="middle">Build + serve</text>
  <text x="415" y="114" class="sub" text-anchor="middle">npm run dev</text>

  <rect x="510" y="70" width="130" height="60" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.3"/>
  <text x="575" y="96" class="box-title" text-anchor="middle">Screenshot</text>
  <text x="575" y="114" class="sub" text-anchor="middle">headless Chrome</text>

  <rect x="670" y="70" width="200" height="60" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.3"/>
  <text x="770" y="96" class="box-title" text-anchor="middle">Feedback</text>
  <text x="770" y="114" class="sub" text-anchor="middle">VLM text + file:line</text>

  <line x1="162" y1="100" x2="188" y2="100" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="322" y1="100" x2="348" y2="100" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="482" y1="100" x2="508" y2="100" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="642" y1="100" x2="668" y2="100" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Loopback: feedback → LLM (next turn) -->
  <path d="M 770 130 v 25 q 0 10 -10 10 h -495 q -10 0 -10 -10 v -25" fill="none" stroke="#2d3748" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="495" y="182" class="sub" text-anchor="middle">next turn</text>

  <!-- guixcoder package container -->
  <rect x="30" y="220" width="840" height="100" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="1.8"/>
  <text x="50" y="244" class="pkg-title">guixcoder package</text>
  <text x="50" y="260" class="g-sub">augments Feedback when use_structured_feedback=True</text>

  <rect x="200" y="270" width="180" height="36" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.3"/>
  <text x="290" y="293" class="box-title" text-anchor="middle">CodeGraph (tree-sitter)</text>

  <rect x="400" y="270" width="160" height="36" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.3"/>
  <text x="480" y="293" class="box-title" text-anchor="middle">DOM extractor</text>

  <rect x="580" y="270" width="180" height="36" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.3"/>
  <text x="670" y="293" class="box-title" text-anchor="middle">DOM→Code Aligner</text>

  <line x1="383" y1="288" x2="397" y2="288" stroke="#2f855a" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <line x1="563" y1="288" x2="577" y2="288" stroke="#2f855a" stroke-width="1.4" marker-end="url(#arr-g)"/>

  <!-- Aligner → Feedback -->
  <path d="M 760 288 h 40 q 15 0 15 -15 v -143" fill="none" stroke="#2f855a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>
  <text x="840" y="210" class="g-sub" text-anchor="middle">file:line</text>
</svg>
